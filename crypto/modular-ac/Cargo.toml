[package]
name = "modular-ac"
version = "0.1.0"
edition = "2024"

[dependencies]
bbs_plus = "0.25"
ark-bls12-381 = "0.4"
ark-secp256r1 = { version = "^0.4.0", default-features = false }
ark-std = "0.4"
dock_crypto_utils = "0.23.0"
sha2 = "0.10.8"
ark-serialize = { version = "^0.4.1", default-features = false, features = [
    "derive",
] }
schnorr_pok = "0.23.0"
proof_system = {version = "0.34.0"}
chrono = "0.4.44"
bulletproofs_plus_plus = "0.9.0"
serde_json = "1.0.149"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
kvac = "0.8.0"
ark-ec = "0.4.1"
equality_across_groups = "0.2.0"
ark-ff = "0.4.1"

[dev-dependencies]
ark-std = { version = "0.4", features = ["print-trace"] }